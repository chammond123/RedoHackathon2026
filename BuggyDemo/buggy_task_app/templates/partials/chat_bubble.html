<!-- Floating Bug Report Chat Bubble -->
<div id="bug-bubble">
    <button id="bug-bubble-toggle" title="Report a Bug">
        <span class="bubble-icon">🐛</span>
        <span class="bubble-close">✕</span>
    </button>

    <div id="bug-chat-window">
        <div class="chat-header">
            <span>🐛 Bug Reporter</span>
            <button id="chat-reset" title="New conversation">↺</button>
        </div>

        <div id="chat-messages">
            <div class="chat-msg bot">
                <div class="msg-bubble">
                    Hi! I'm the bug report assistant. Describe the bug you found and I'll help you file a report.<br><br>
                    <em>What went wrong?</em>
                </div>
            </div>
        </div>

        <div id="chat-input-area">
            <input type="text" id="chat-input" placeholder="Describe the bug…" autocomplete="off">
            <button id="chat-send">➤</button>
        </div>
    </div>
</div>

<style>
    #bug-bubble {
        position: fixed;
        bottom: 1.5rem;
        right: 1.5rem;
        z-index: 9999;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #bug-bubble-toggle {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: #e94560;
        border: none;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(233,69,96,0.4);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.2s, box-shadow 0.2s;
    }

    #bug-bubble-toggle:hover {
        transform: scale(1.08);
        box-shadow: 0 6px 20px rgba(233,69,96,0.5);
    }

    .bubble-icon, .bubble-close { font-size: 1.5rem; }
    .bubble-close { display: none; color: #fff; font-size: 1.2rem; }
    #bug-bubble.open .bubble-icon { display: none; }
    #bug-bubble.open .bubble-close { display: block; }

    #bug-chat-window {
        display: none;
        position: absolute;
        bottom: 70px;
        right: 0;
        width: 370px;
        max-height: 520px;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 8px 30px rgba(0,0,0,0.15);
        overflow: hidden;
        flex-direction: column;
    }

    #bug-bubble.open #bug-chat-window {
        display: flex;
    }

    .chat-header {
        background: #16213e;
        color: #fff;
        padding: 0.75rem 1rem;
        font-weight: 600;
        font-size: 0.95rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .chat-header button {
        background: none;
        border: none;
        color: #a8b2d1;
        cursor: pointer;
        font-size: 1.2rem;
        padding: 0;
    }

    .chat-header button:hover { color: #fff; }

    #chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 1rem;
        max-height: 340px;
        min-height: 200px;
    }

    .chat-msg {
        margin-bottom: 0.75rem;
        display: flex;
    }

    .chat-msg.bot { justify-content: flex-start; }
    .chat-msg.user { justify-content: flex-end; }

    .msg-bubble {
        max-width: 85%;
        padding: 0.6rem 0.85rem;
        border-radius: 12px;
        font-size: 0.88rem;
        line-height: 1.45;
        word-wrap: break-word;
    }

    .chat-msg.bot .msg-bubble {
        background: #f0f2f5;
        color: #1a1a2e;
        border-bottom-left-radius: 4px;
    }

    .chat-msg.user .msg-bubble {
        background: #0a3d62;
        color: #fff;
        border-bottom-right-radius: 4px;
    }

    #chat-input-area {
        display: flex;
        border-top: 1px solid #eee;
        padding: 0.5rem;
        gap: 0.4rem;
    }

    #chat-input {
        flex: 1;
        padding: 0.5rem 0.75rem;
        border: 1px solid #ddd;
        border-radius: 20px;
        font-size: 0.88rem;
        outline: none;
        font-family: inherit;
        margin: 0;
    }

    #chat-input:focus { border-color: #0a3d62; }

    #chat-send {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: #0a3d62;
        color: #fff;
        border: none;
        cursor: pointer;
        font-size: 1rem;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
    }

    #chat-send:hover { background: #0c4a75; }
    #chat-send:disabled { opacity: 0.5; cursor: not-allowed; }

    @media (max-width: 480px) {
        #bug-chat-window { width: calc(100vw - 2rem); right: -0.5rem; }
    }
</style>

<script>
(function() {
    // ---------------------------------------------------------------
    //  Configuration
    // ---------------------------------------------------------------
    // Gateway public chat API & local bug-report save endpoint
    const GATEWAY_URL   = window.BUGFIXER_GATEWAY_URL || 'http://localhost:3001';
    const LOCAL_API_URL = '/api/bug-report';          // save to Flask too
    const API_KEY       = window.BUGFIXER_API_KEY || '';
    const REPO_PATH     = window.BUGFIXER_REPO_PATH || '/app/BuggyDemo';
    // ---------------------------------------------------------------

    const toggle   = document.getElementById('bug-bubble-toggle');
    const bubble   = document.getElementById('bug-bubble');
    const input    = document.getElementById('chat-input');
    const sendBtn  = document.getElementById('chat-send');
    const messages = document.getElementById('chat-messages');
    const resetBtn = document.getElementById('chat-reset');

    let step      = 0;   // conversation step
    let answers   = [];
    let chatId    = null; // active agent run id
    let ws        = null; // WebSocket for live updates
    let agentDone = false;

    // ── Phase icons for agent progress ──
    const PHASE_ICONS = {
        intake:       '🔍',
        hypothesizing:'💡',
        reproducing:  '🔄',
        analyzing:    '🧪',
        root_cause:   '🎯',
        patching:     '🩹',
        validating:   '✅',
        complete:     '🎉',
        failed:       '❌',
        pending:      '⏳',
    };

    toggle.addEventListener('click', function() {
        bubble.classList.toggle('open');
        if (bubble.classList.contains('open')) {
            setTimeout(() => input.focus(), 100);
        }
    });

    function addMessage(text, sender) {
        const div = document.createElement('div');
        div.className = 'chat-msg ' + sender;
        const bub = document.createElement('div');
        bub.className = 'msg-bubble';
        bub.innerHTML = text;
        div.appendChild(bub);
        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
    }

    function botReply(text) { addMessage(text, 'bot'); }
    function systemReply(text) {
        const div = document.createElement('div');
        div.className = 'chat-msg bot';
        const bub = document.createElement('div');
        bub.className = 'msg-bubble';
        bub.style.background = '#e8f4fd';
        bub.style.borderLeft = '3px solid #0a3d62';
        bub.style.fontSize = '0.82rem';
        bub.innerHTML = text;
        div.appendChild(bub);
        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
    }

    // ── Conversation flow (5 steps → collect bug info) ──
    function getReply(userMessage) {
        switch (step) {
            case 0:
                return 'Got it \u2014 "' + userMessage + '".<br><br>What did you <em>expect</em> to happen instead?';
            case 1:
                return 'Thanks. Can you list the <strong>steps to reproduce</strong> this bug?<br><small>(e.g. "1. Add a task &nbsp;2. Delete it &nbsp;3. Add another")</small>';
            case 2:
                return 'Which module do you think is affected?<br><br>' +
                    '<small>Options: <code>tasks.py</code> \u00b7 <code>storage.py</code> \u00b7 <code>utils.py</code> \u00b7 <code>app.py</code> \u00b7 <code>constants.py</code> \u00b7 <code>unknown</code></small>';
            case 3:
                return 'And how severe is this?<br><br>' +
                    '<small><strong>low</strong> \u00b7 <strong>medium</strong> \u00b7 <strong>high</strong> \u00b7 <strong>critical</strong></small>';
            case 4:
                return '⏳ Submitting to BugFixer agent\u2026';
            default:
                return null;
        }
    }

    function buildBugReport() {
        const desc = answers[0] + '\n\nExpected: ' + answers[1]
                   + '\n\nSteps to reproduce:\n' + answers[2]
                   + '\n\nSuspected module: ' + answers[3]
                   + '\nSeverity: ' + answers[4];
        return {
            title:       answers[0].substring(0, 80),
            description: desc,
            steps:       answers[2],
            module:      answers[3],
            severity:    answers[4].toLowerCase(),
            reporter:    'Chat User',
        };
    }

    // ── Save locally to Flask AND dispatch to BugFixer agent ──
    async function submitReport(report) {
        // 1) Save to local Flask endpoint (fire-and-forget)
        fetch(LOCAL_API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(report),
        }).catch(function() { /* ok if local save fails */ });

        // 2) Start an agent run via the gateway's public chat API
        try {
            const headers = { 'Content-Type': 'application/json' };
            if (API_KEY) headers['X-API-Key'] = API_KEY;

            const resp = await fetch(GATEWAY_URL + '/api/chat/start', {
                method: 'POST',
                headers: headers,
                body: JSON.stringify({
                    bug_report: report.description,
                    repo_path:  REPO_PATH,
                }),
            });

            if (!resp.ok) {
                const err = await resp.json().catch(function() { return {}; });
                throw new Error(err.error || 'Gateway returned ' + resp.status);
            }

            const data = await resp.json();
            chatId = data.chat_id;
            agentDone = false;

            botReply(
                '✅ Bug report submitted!<br><br>' +
                '<strong>Bug:</strong> ' + report.title + '<br>' +
                '<strong>Module:</strong> ' + report.module + '<br>' +
                '<strong>Severity:</strong> ' + report.severity + '<br><br>' +
                '🤖 <strong>BugFixer agent started</strong> (run <code>' + chatId.substring(0, 8) + '…</code>)<br>' +
                '<em>I\'ll stream live progress below…</em>'
            );

            // 3) Open a public WebSocket to receive live agent updates
            connectWebSocket(chatId);

        } catch (err) {
            botReply('⚠️ Failed to start agent: ' + err.message + '<br><br><em>The bug report was saved locally.</em>');
        }
    }

    // ── WebSocket for real-time agent progress ──
    function connectWebSocket(runId) {
        if (ws) { ws.close(); ws = null; }

        const wsProto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = GATEWAY_URL.replace(/^http/, 'ws') + '/ws/chat/' + runId;

        ws = new WebSocket(wsUrl);

        ws.onopen = function() {
            systemReply('📡 Connected — watching agent progress…');
        };

        ws.onmessage = function(evt) {
            try {
                const event = JSON.parse(evt.data);
                handleAgentEvent(event);
            } catch(e) { /* ignore */ }
        };

        ws.onclose = function() {
            if (!agentDone) {
                systemReply('📡 Connection closed.');
            }
        };

        ws.onerror = function() {
            systemReply('⚠️ WebSocket error — checking status via polling…');
            ws.close();
            startStatusPolling(runId);
        };
    }

    function handleAgentEvent(event) {
        switch (event.type) {
            case 'connected':
                // initial handshake, ignore
                break;

            case 'phase_change': {
                const icon = PHASE_ICONS[event.phase] || '▶';
                const msg = event.message || ('Phase: ' + event.phase);
                systemReply(icon + ' ' + msg);
                break;
            }

            case 'run_complete': {
                agentDone = true;
                const icon = event.status === 'complete' ? '🎉' : '❌';
                const msg = event.message || (event.status === 'complete'
                    ? 'Bug fixed successfully!'
                    : 'Agent could not fix the bug.');
                botReply(
                    icon + ' <strong>' + msg + '</strong><br><br>' +
                    '<em>You can report another bug or close this chat.</em>'
                );
                if (ws) { ws.close(); ws = null; }
                break;
            }

            default:
                // Other public events — show message if present
                if (event.message) {
                    systemReply(event.message);
                }
        }
    }

    // ── Fallback: poll status if WebSocket fails ──
    function startStatusPolling(runId) {
        const headers = {};
        if (API_KEY) headers['X-API-Key'] = API_KEY;

        const poll = setInterval(async function() {
            try {
                const resp = await fetch(GATEWAY_URL + '/api/chat/' + runId + '/status', { headers });
                if (!resp.ok) return;
                const data = await resp.json();

                if (data.status === 'complete' || data.status === 'failed') {
                    clearInterval(poll);
                    agentDone = true;
                    const icon = data.status === 'complete' ? '🎉' : '❌';
                    botReply(icon + ' <strong>Agent finished: ' + data.status + '</strong>');
                }
            } catch(e) { /* keep polling */ }
        }, 3000);

        // Safety: stop after 10 min
        setTimeout(function() { clearInterval(poll); }, 600000);
    }

    // ── Chat input handler ──
    async function handleSend() {
        const text = input.value.trim();
        if (!text) return;

        input.value = '';
        addMessage(text, 'user');
        sendBtn.disabled = true;

        // If agent is running, allow follow-up messages
        if (chatId && !agentDone) {
            const headers = { 'Content-Type': 'application/json' };
            if (API_KEY) headers['X-API-Key'] = API_KEY;

            try {
                const resp = await fetch(GATEWAY_URL + '/api/chat/' + chatId + '/message', {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify({ content: text }),
                });
                const data = await resp.json();
                if (data.content) botReply(data.content);
            } catch(e) {
                botReply('⚠️ Could not send message: ' + e.message);
            }
            sendBtn.disabled = false;
            input.focus();
            return;
        }

        // Normal conversation flow
        answers.push(text);
        var reply = getReply(text);
        if (reply) botReply(reply);

        if (step === 4) {
            await submitReport(buildBugReport());
            step = 0;
            answers = [];
        } else {
            step++;
        }

        sendBtn.disabled = false;
        input.focus();
    }

    sendBtn.addEventListener('click', handleSend);
    input.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            handleSend();
        }
    });

    resetBtn.addEventListener('click', function() {
        step = 0;
        answers = [];
        chatId = null;
        agentDone = false;
        if (ws) { ws.close(); ws = null; }
        messages.innerHTML = '';
        botReply('Hi! I\'m the bug report assistant. Describe the bug you found and I\'ll help you file a report.<br><br><em>What went wrong?</em>');
    });
})();
</script>
