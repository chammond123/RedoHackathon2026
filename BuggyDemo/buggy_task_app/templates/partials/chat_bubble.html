<!-- Floating Bug Report Chat Bubble -->
<div id="bug-bubble">
    <button id="bug-bubble-toggle" title="Report a Bug">
        <span class="bubble-icon">🐛</span>
        <span class="bubble-close">✕</span>
    </button>

    <div id="bug-chat-window">
        <div class="chat-header">
            <span>🐛 Bug Reporter</span>
            <button id="chat-reset" title="New conversation">↺</button>
        </div>

        <div id="chat-messages">
            <div class="chat-msg bot">
                <div class="msg-bubble">
                    Hi! I'm here to help you report any issues you've found.<br><br>
                    <em>Please describe what went wrong:</em>
                </div>
            </div>
        </div>

        <div id="chat-input-area">
            <input type="text" id="chat-input" placeholder="Describe the bug…" autocomplete="off">
            <button id="chat-send">➤</button>
        </div>
    </div>
</div>

<style>
    #bug-bubble {
        position: fixed;
        bottom: 1.5rem;
        right: 1.5rem;
        z-index: 9999;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #bug-bubble-toggle {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: #e94560;
        border: none;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(233,69,96,0.4);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.2s, box-shadow 0.2s;
    }

    #bug-bubble-toggle:hover {
        transform: scale(1.08);
        box-shadow: 0 6px 20px rgba(233,69,96,0.5);
    }

    .bubble-icon, .bubble-close { font-size: 1.5rem; }
    .bubble-close { display: none; color: #fff; font-size: 1.2rem; }
    #bug-bubble.open .bubble-icon { display: none; }
    #bug-bubble.open .bubble-close { display: block; }

    #bug-chat-window {
        display: none;
        position: absolute;
        bottom: 70px;
        right: 0;
        width: 370px;
        max-height: 520px;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 8px 30px rgba(0,0,0,0.15);
        overflow: hidden;
        flex-direction: column;
    }

    #bug-bubble.open #bug-chat-window {
        display: flex;
    }

    .chat-header {
        background: #16213e;
        color: #fff;
        padding: 0.75rem 1rem;
        font-weight: 600;
        font-size: 0.95rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .chat-header button {
        background: none;
        border: none;
        color: #a8b2d1;
        cursor: pointer;
        font-size: 1.2rem;
        padding: 0;
    }

    .chat-header button:hover { color: #fff; }

    #chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 1rem;
        max-height: 340px;
        min-height: 200px;
    }

    .chat-msg {
        margin-bottom: 0.75rem;
        display: flex;
    }

    .chat-msg.bot { justify-content: flex-start; }
    .chat-msg.user { justify-content: flex-end; }

    .msg-bubble {
        max-width: 85%;
        padding: 0.6rem 0.85rem;
        border-radius: 12px;
        font-size: 0.88rem;
        line-height: 1.45;
        word-wrap: break-word;
    }

    .chat-msg.bot .msg-bubble {
        background: #f0f2f5;
        color: #1a1a2e;
        border-bottom-left-radius: 4px;
    }

    .chat-msg.user .msg-bubble {
        background: #0a3d62;
        color: #fff;
        border-bottom-right-radius: 4px;
    }

    #chat-input-area {
        display: flex;
        border-top: 1px solid #eee;
        padding: 0.5rem;
        gap: 0.4rem;
    }

    #chat-input {
        flex: 1;
        padding: 0.5rem 0.75rem;
        border: 1px solid #ddd;
        border-radius: 20px;
        font-size: 0.88rem;
        outline: none;
        font-family: inherit;
        margin: 0;
    }

    #chat-input:focus { border-color: #0a3d62; }

    #chat-send {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: #0a3d62;
        color: #fff;
        border: none;
        cursor: pointer;
        font-size: 1rem;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
    }

    #chat-send:hover { background: #0c4a75; }
    #chat-send:disabled { opacity: 0.5; cursor: not-allowed; }

    @media (max-width: 480px) {
        #bug-chat-window { width: calc(100vw - 2rem); right: -0.5rem; }
    }

    /* Typing indicator animation */
    .typing-indicator .msg-bubble {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 0.8rem 1rem;
    }
    
    .typing-indicator .dot {
        width: 8px;
        height: 8px;
        background: #0a3d62;
        border-radius: 50%;
        animation: typing-bounce 1.4s infinite ease-in-out;
    }
    
    .typing-indicator .dot:nth-child(1) { animation-delay: 0s; }
    .typing-indicator .dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator .dot:nth-child(3) { animation-delay: 0.4s; }
    
    @keyframes typing-bounce {
        0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
        30% { transform: translateY(-6px); opacity: 1; }
    }
</style>

<script>
(function() {
    // ---------------------------------------------------------------
    //  Configuration
    // ---------------------------------------------------------------
    // Gateway public chat API & local bug-report save endpoint
    const GATEWAY_URL   = window.BUGFIXER_GATEWAY_URL || 'http://localhost:3001';
    const LOCAL_API_URL = '/api/bug-report';          // save to Flask too
    const API_KEY       = window.BUGFIXER_API_KEY || '';
    // Hardcoded to the path inside the Docker container where the agent runs
    const REPO_PATH     = '/app/BuggyDemo';
    // ---------------------------------------------------------------

    const toggle   = document.getElementById('bug-bubble-toggle');
    const bubble   = document.getElementById('bug-bubble');
    const input    = document.getElementById('chat-input');
    const sendBtn  = document.getElementById('chat-send');
    const messages = document.getElementById('chat-messages');
    const resetBtn = document.getElementById('chat-reset');

    let step      = 0;   // conversation step
    let answers   = [];
    let chatId    = null; // active agent run id
    let ticketId  = null; // ticket id (synced to frontend)
    let ws        = null; // WebSocket for live updates
    let agentDone = false;

    // ── Phase icons for agent progress ──
    const PHASE_ICONS = {
        intake:       '🔍',
        hypothesizing:'💡',
        reproducing:  '🔄',
        analyzing:    '🧪',
        root_cause:   '🎯',
        patching:     '🩹',
        validating:   '✅',
        complete:     '🎉',
        failed:       '❌',
        pending:      '⏳',
    };

    toggle.addEventListener('click', function() {
        bubble.classList.toggle('open');
        if (bubble.classList.contains('open')) {
            setTimeout(() => input.focus(), 100);
        }
    });

    function addMessage(text, sender) {
        const div = document.createElement('div');
        div.className = 'chat-msg ' + sender;
        const bub = document.createElement('div');
        bub.className = 'msg-bubble';
        bub.innerHTML = text;
        div.appendChild(bub);
        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
    }

    function botReply(text) { addMessage(text, 'bot'); }
    function systemReply(text) {
        const div = document.createElement('div');
        div.className = 'chat-msg bot';
        const bub = document.createElement('div');
        bub.className = 'msg-bubble';
        bub.style.background = '#e8f4fd';
        bub.style.borderLeft = '3px solid #0a3d62';
        bub.style.fontSize = '0.82rem';
        bub.innerHTML = text;
        div.appendChild(bub);
        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
    }

    // ── Conversation flow (2 steps: description → optional email) ──
    function getReply(userMessage) {
        switch (step) {
            case 0:
                return 'Thanks for letting us know!<br><br>' +
                    'If you\'d like us to follow up with you, please enter your <strong>email address</strong>.<br>' +
                    '<small>(Or type "skip" to submit anonymously)</small>';
            case 1:
                return '⏳ Submitting your report\u2026';
            default:
                return null;
        }
    }

    function buildBugReport() {
        const bugDescription = answers[0];
        const email = answers[1] && answers[1].toLowerCase() !== 'skip' ? answers[1] : '';
        
        return {
            title:       bugDescription.substring(0, 80),
            description: bugDescription,
            steps:       '',
            module:      '',
            severity:    'medium',
            reporter:    email || 'Anonymous',
            email:       email,
        };
    }

    // ── Save locally to Flask AND dispatch to BugFixer agent ──
    async function submitReport(report) {
        // 1) Save to local Flask endpoint (fire-and-forget)
        fetch(LOCAL_API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(report),
        }).catch(function() { /* ok if local save fails */ });

        // Show typing indicator while connecting
        showTypingIndicator();

        // 2) Start an agent run via the gateway's public chat API
        //    Include the ticket data so it syncs to the frontend dashboard
        try {
            const headers = { 'Content-Type': 'application/json' };
            if (API_KEY) headers['X-API-Key'] = API_KEY;

            console.log('Submitting to:', GATEWAY_URL + '/api/chat/start');
            
            const resp = await fetch(GATEWAY_URL + '/api/chat/start', {
                method: 'POST',
                headers: headers,
                body: JSON.stringify({
                    bug_report: report.description,
                    repo_path:  REPO_PATH,
                    // Include ticket data for frontend dashboard sync
                    ticket: {
                        title: report.title,
                        description: report.description,
                        steps: report.steps,
                        module: report.module,
                        severity: report.severity,
                        reporter: report.reporter,
                    }
                }),
            });

            hideTypingIndicator();

            if (!resp.ok) {
                const err = await resp.json().catch(function() { return {}; });
                throw new Error(err.error || 'Gateway returned ' + resp.status);
            }

            const data = await resp.json();
            chatId = data.chat_id;
            ticketId = data.ticket_id;
            agentDone = false;

            botReply(
                '✅ <strong>Thank you!</strong> Your bug report has been submitted.<br><br>' +
                (report.email ? '📧 We\'ll follow up at <strong>' + report.email + '</strong> if needed.<br><br>' : '') +
                'Our team is now looking into this issue. ' +
                '<em>You can close this chat or report another issue.</em>'
            );

            // 3) Open a public WebSocket to receive live agent updates
            connectWebSocket(chatId);

        } catch (err) {
            hideTypingIndicator();
            botReply('⚠️ Failed to start agent: ' + err.message + '<br><br><em>The bug report was saved locally.</em>');
        }
    }

    // ── Typing indicator for dynamic feel ──
    let typingDiv = null;
    
    function showTypingIndicator() {
        if (typingDiv) return;
        typingDiv = document.createElement('div');
        typingDiv.className = 'chat-msg bot typing-indicator';
        typingDiv.innerHTML = '<div class="msg-bubble"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>';
        messages.appendChild(typingDiv);
        messages.scrollTop = messages.scrollHeight;
    }
    
    function hideTypingIndicator() {
        if (typingDiv) {
            typingDiv.remove();
            typingDiv = null;
        }
    }

    // ── WebSocket for real-time agent progress ──
    function connectWebSocket(runId) {
        if (ws) { ws.close(); ws = null; }

        const wsProto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = GATEWAY_URL.replace(/^http/, 'ws') + '/ws/chat/' + runId;

        ws = new WebSocket(wsUrl);

        ws.onopen = function() {
            systemReply('📡 Connected — watching agent progress…');
        };

        ws.onmessage = function(evt) {
            try {
                const event = JSON.parse(evt.data);
                handleAgentEvent(event);
            } catch(e) { /* ignore */ }
        };

        ws.onclose = function() {
            if (!agentDone) {
                systemReply('📡 Connection closed.');
            }
        };

        ws.onerror = function() {
            systemReply('⚠️ WebSocket error — checking status via polling…');
            ws.close();
            startStatusPolling(runId);
        };
    }

    function handleAgentEvent(event) {
        switch (event.type) {
            case 'connected':
                // initial handshake, ignore
                break;

            case 'typing': {
                // Dynamic typing indicator from agent
                if (event.is_typing) {
                    showTypingIndicator();
                } else {
                    hideTypingIndicator();
                }
                break;
            }

            case 'chat_feedback': {
                // Intermediate feedback during processing
                hideTypingIndicator();
                const icons = { info: 'ℹ️', warning: '⚠️', success: '✅', question: '❓' };
                const icon = icons[event.feedback_type] || 'ℹ️';
                systemReply(icon + ' ' + event.message);
                break;
            }

            case 'phase_change': {
                hideTypingIndicator();
                const icon = PHASE_ICONS[event.phase] || '▶';
                const msg = event.message || ('Phase: ' + event.phase);
                systemReply(icon + ' ' + msg);
                break;
            }

            case 'run_complete': {
                hideTypingIndicator();
                agentDone = true;
                const icon = event.status === 'complete' ? '🎉' : '❌';
                const msg = event.message || (event.status === 'complete'
                    ? 'Bug fixed successfully!'
                    : 'Agent could not fix the bug.');
                botReply(
                    icon + ' <strong>' + msg + '</strong><br><br>' +
                    '<em>You can report another bug or close this chat.</em>'
                );
                if (ws) { ws.close(); ws = null; }
                break;
            }

            default:
                // Other public events — show message if present
                if (event.message) {
                    hideTypingIndicator();
                    systemReply(event.message);
                }
        }
    }

    // ── Fallback: poll status if WebSocket fails ──
    function startStatusPolling(runId) {
        const headers = {};
        if (API_KEY) headers['X-API-Key'] = API_KEY;

        const poll = setInterval(async function() {
            try {
                const resp = await fetch(GATEWAY_URL + '/api/chat/' + runId + '/status', { headers });
                if (!resp.ok) return;
                const data = await resp.json();

                if (data.status === 'complete' || data.status === 'failed') {
                    clearInterval(poll);
                    agentDone = true;
                    const icon = data.status === 'complete' ? '🎉' : '❌';
                    botReply(icon + ' <strong>Agent finished: ' + data.status + '</strong>');
                }
            } catch(e) { /* keep polling */ }
        }, 3000);

        // Safety: stop after 10 min
        setTimeout(function() { clearInterval(poll); }, 600000);
    }

    // ── Chat input handler ──
    async function handleSend() {
        const text = input.value.trim();
        if (!text) return;

        input.value = '';
        addMessage(text, 'user');
        sendBtn.disabled = true;

        // If agent is running, allow follow-up messages
        if (chatId && !agentDone) {
            const headers = { 'Content-Type': 'application/json' };
            if (API_KEY) headers['X-API-Key'] = API_KEY;

            try {
                const resp = await fetch(GATEWAY_URL + '/api/chat/' + chatId + '/message', {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify({ content: text }),
                });
                const data = await resp.json();
                if (data.content) botReply(data.content);
            } catch(e) {
                botReply('⚠️ Could not send message: ' + e.message);
            }
            sendBtn.disabled = false;
            input.focus();
            return;
        }

        // Normal conversation flow
        answers.push(text);
        var reply = getReply(text);
        if (reply) botReply(reply);

        if (step === 1) {
            await submitReport(buildBugReport());
            step = 0;
            answers = [];
        } else {
            step++;
        }

        sendBtn.disabled = false;
        input.focus();
    }

    sendBtn.addEventListener('click', handleSend);
    input.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            handleSend();
        }
    });

    resetBtn.addEventListener('click', function() {
        step = 0;
        answers = [];
        chatId = null;
        ticketId = null;
        agentDone = false;
        hideTypingIndicator();
        if (ws) { ws.close(); ws = null; }
        messages.innerHTML = '';
        botReply('Hi! I\'m here to help you report any issues you\'ve found.<br><br><em>Please describe what went wrong:</em>');
    });
})();
</script>
